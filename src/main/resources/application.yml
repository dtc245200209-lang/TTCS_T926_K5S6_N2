server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Secret key tối thiểu 256 bits cho HS256
  secret: mySecretKeyForJwtSigningMustBeVeryLongAndSecure12345678
  # Thời gian hết hạn của token: 24h = 86400000 ms
  expiration-ms: 86400000
