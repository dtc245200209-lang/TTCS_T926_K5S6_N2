services:
  db:
    image: postgres:16
    container_name: ats-postgres
    environment:
      POSTGRES_DB: ats_db
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user -d ats_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ats-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ats_db
      DB_USER: ats_user
      DB_PASSWORD: ats_password
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: ats-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
