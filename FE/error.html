<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông Báo Lỗi - Hệ Thống Tuyển Dụng</title>
    <style>
      :root {
        --bg-color: #0d0f18;
        --card-bg: #161b2e;
        --neon-blue: #00f3ff;
        --neon-pink: #ff007f;
        --text-color: #e0e6ed;
        --sub-text: #8a99ad;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-image:
          radial-gradient(
            circle at 10% 20%,
            rgba(0, 243, 255, 0.05) 0%,
            transparent 20%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(255, 0, 127, 0.05) 0%,
            transparent 20%
          );
      }

      .error-container {
        background-color: var(--card-bg);
        border: 1px solid rgba(0, 243, 255, 0.2);
        box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
        border-radius: 12px;
        padding: 40px;
        max-width: 540px;
        width: 90%;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .error-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
      }

      .error-code {
        font-size: 80px;
        font-weight: 900;
        letter-spacing: 4px;
        color: var(--neon-blue);
        text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
        margin-bottom: 10px;
        line-height: 1;
      }

      .error-title {
        font-size: 22px;
        color: #ffffff;
        margin-bottom: 15px;
        font-weight: 600;
      }

      .error-description {
        color: var(--sub-text);
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .action-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid transparent;
      }

      .btn-primary {
        background-color: transparent;
        color: var(--neon-blue);
        border-color: var(--neon-blue);
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
      }

      .btn-primary:hover {
        background-color: var(--neon-blue);
        color: #000;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
      }

      .btn-secondary {
        background-color: transparent;
        color: var(--neon-pink);
        border-color: var(--neon-pink);
        box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
      }

      .btn-secondary:hover {
        background-color: var(--neon-pink);
        color: #fff;
        box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
      }

      .btn-outline {
        background-color: transparent;
        color: var(--text-color);
        border-color: rgba(224, 230, 237, 0.3);
      }

      .btn-outline:hover {
        background-color: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-code" id="errorCode"></div>
      <div class="error-title" id="errorTitle"></div>
      <div class="error-description" id="errorDesc"></div>

      <div class="action-buttons">
        <button onclick="history.back()" class="btn btn-outline">
          ↩ Quay Lại Trang Trước
        </button>
        <a href="index.html" class="btn btn-primary">🏠 Trang Chủ</a>
        <a href="login.html" class="btn btn-secondary" id="btnLoginAction"
          >🔑 Đăng Nhập Lại</a
        >
      </div>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code") || "404";

      const errorMap = {
        401: {
          title: "Chưa Xác Thực Phiên Làm Việc",
          desc: "Phiên đăng nhập của bạn đã hết hạn hoặc chưa được xác thực. Vui lòng đăng nhập lại để tiếp tục công việc.",
        },
        403: {
          title: "Truy Cập Bị Từ Chối",
          desc: "Tài khoản của bạn không đủ thẩm quyền nhân sự để truy cập vào khu vực này. Vui lòng kiểm tra lại quyền hạn hoặc đăng nhập tài khoản khác.",
        },
        404: {
          title: "Không Tìm Thấy Trang",
          desc: "Đường dẫn bạn vừa truy cập không tồn tại hoặc đã bị di chuyển khỏi hệ thống tuyển dụng.",
        },
        500: {
          title: "Lỗi Máy Chủ Nội Bộ",
          desc: "Hệ thống đang gặp sự cố gián đoạn tạm thời. Kỹ thuật viên đang khắc phục, vui lòng quay lại sau ít phút.",
        },
      };

      const currentError = errorMap[code] || errorMap["404"];

      document.getElementById("errorCode").innerText = code;
      document.getElementById("errorTitle").innerText = currentError.title;
      document.getElementById("errorDesc").innerText = currentError.desc;
    </script>
  </body>
</html>
