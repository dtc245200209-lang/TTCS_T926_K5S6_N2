<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Hệ thống Tuyển dụng Nội bộ</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        background-color: #f1f5f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        background: #ffffff;
        width: 100%;
        max-width: 400px;
        padding: 36px 30px;
        border-radius: 12px;
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.05),
          0 8px 10px -6px rgba(0, 0, 0, 0.01);
        border: 1px solid #e2e8f0;
      }

      .brand {
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #2563eb;
        margin-bottom: 8px;
      }

      .title {
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 10px;
      }

      .description {
        text-align: center;
        font-size: 14px;
        color: #64748b;
        line-height: 1.5;
        margin-bottom: 20px;
      }

      /* Style cho thông báo hết hạn phiên (KN-16) */
      .alert {
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 20px;
        text-align: center;
        display: none; /* Mặc định ẩn, sẽ hiện lên khi phiên hết hạn */
      }

      .alert-warning {
        background-color: #fef3c7;
        color: #92400e;
        border: 1px solid #fde68a;
      }

      .alert-success {
        background-color: #d1fae5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 6px;
      }

      .form-group input {
        width: 100%;
        padding: 11px 14px;
        font-size: 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        transition: all 0.2s ease;
      }

      .form-group input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .btn-submit:hover {
        background-color: #1d4ed8;
      }

      .footer-link {
        text-align: center;
        margin-top: 22px;
      }

      .footer-link a {
        color: #64748b;
        font-size: 14px;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
      }

      .footer-link a:hover {
        color: #2563eb;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Tên hệ thống -->
      <div class="brand">Hệ thống Tuyển dụng Nội bộ</div>

      <!-- Tiêu đề -->
      <h2 class="title">Đăng nhập</h2>

      <!-- Hướng dẫn -->
      <p class="description">Vui lòng đăng nhập để tiếp tục làm việc.</p>

      <!-- Khung thông báo hết hạn phiên (KN-16) -->
      <div id="sessionAlert" class="alert alert-warning">
        ⚠️ Phiên làm việc đã hết hạn. Vui lòng đăng nhập lại!
      </div>

      <!-- Form giao diện đăng nhập -->
      <form id="loginForm" action="#" method="POST" onsubmit="return false;">
        <div class="form-group">
          <label for="username">Tên đăng nhập / Email</label>
          <input
            type="text"
            id="username"
            placeholder="Nhập email hoặc username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input
            type="password"
            id="password"
            placeholder="Nhập mật khẩu"
            required
          />
        </div>

        <button type="submit" class="btn-submit">Đăng nhập</button>
      </form>

      <!-- Link chuyển hướng -->
      <div class="footer-link">
        <a href="forgot-password.html">Quên mật khẩu?</a>
      </div>
    </div>

    <script>
      // Xử lý tự động hiển thị thông báo hết hạn phiên (KN-16)
      document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const alertBox = document.getElementById("sessionAlert");

        // Khi bị hết hạn phiên đăng nhập
        if (urlParams.get("session") === "expired") {
          alertBox.textContent =
            "⚠️ Phiên làm việc đã hết hạn. Vui lòng đăng nhập lại!";
          alertBox.className = "alert alert-warning";
          alertBox.style.display = "block";
        }
        // Khi người dùng bấm đăng xuất thành công
        else if (urlParams.get("action") === "logout") {
          alertBox.textContent =
            "✅ Bạn đã đăng xuất thành công khỏi hệ thống!";
          alertBox.className = "alert alert-success";
          alertBox.style.display = "block";
        }
      });
    </script>
  </body>
</html>
