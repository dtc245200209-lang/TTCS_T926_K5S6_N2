<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - Hệ thống Tuyển dụng Nội bộ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 36px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }

    .brand {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .footer-link {
      text-align: center;
      margin-top: 22px;
    }

    .footer-link a {
      color: #64748b;
      font-size: 14px;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .footer-link a:hover {
      color: #2563eb;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tên hệ thống -->
    <div class="brand">Hệ thống Tuyển dụng Nội bộ</div>
    
    <!-- Tiêu đề -->
    <h2 class="title">Quên mật khẩu</h2>
    
    <!-- Hướng dẫn -->
    <p class="description">Nhập email đã đăng ký để nhận liên kết đặt lại mật khẩu.</p>

    <!-- Form giao diện -->
    <form action="#" method="POST" onsubmit="return false;">
      <div class="form-group">
        <label for="email">Email công việc</label>
        <input type="email" id="email" placeholder="example@company.com" required>
      </div>

      <button type="submit" class="btn-submit">Gửi yêu cầu</button>
    </form>

    <!-- Link quay lại -->
    <div class="footer-link">
      <a href="#">&larr; Quay lại đăng nhập</a>
    </div>
  </div>

</body>
</html>
<!-- Quen mat khau UI -->
